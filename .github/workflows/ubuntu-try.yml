name: Try Ubuntu runner (tmate)
# Mở một máy Ubuntu của GitHub (ubuntu-latest, 4 CPU / 16 GB) rồi cho SSH vào
# bằng tmate để xem thử trực tiếp. Chạy tay: Actions -> Try Ubuntu runner ->
# Run workflow, hoặc: gh workflow run ubuntu-try.yml
# Lấy chuỗi SSH trong log của step "Open tmate session" rồi chạy trên máy mình.
# Kết thúc: gõ exit trong SSH, hoặc Cancel run. Job tự hết sau 60 phút.
on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: System info
        run: |
          lsb_release -a
          uname -a
          nproc
          free -h
          df -h /
          whoami
          hostname

      - name: Open tmate session
        uses: mxschmitt/action-tmate@v3
